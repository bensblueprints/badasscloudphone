server {
    server_name badasscloudphone.com;
    root /srv/badass-websites/dist/badasscloudphone.com;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ =404; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/badasscloudphone.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/badasscloudphone.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = badasscloudphone.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name badasscloudphone.com;
    return 404; # managed by Certbot


}